name: Build iOS IPA (u3dconv)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: Install Apple Certificate and Provisioning Profile (if configured)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "Configuring Apple code signing..."
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
            PP_PATH="$RUNNER_TEMP/profile.mobileprovision"

            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          else
            echo "No signing secrets found; skipping certificate import."
          fi

      - name: Create and build Briefcase iOS project
        run: |
          briefcase create iOS --no-input
          briefcase update iOS --no-input
          briefcase build iOS --no-input

      - name: Package IPA (when signed)
        run: |
          if [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" ]; then
            briefcase package iOS --no-input
          else
            echo "Skipping briefcase package because signing secrets are not set."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: u3dconv-ios-build
          path: |
            build/u3dconv/ios/xcode/build/
            dist/
          if-no-files-found: warn
